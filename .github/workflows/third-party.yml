name: third-party skills

# Once a week, copy new upstream versions of the third-party skills listed in third-party.json
# and open a PR. A PR opened with GITHUB_TOKEN does not trigger the ci workflow: the gates run
# again in the release sitting that reviews and merges it.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy new upstream versions
        run: bin/harness third-party
      - name: Regenerate the catalog
        run: bin/harness catalog
      - name: Open a PR when something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "no third-party update"; exit 0; fi
          branch="chore/third-party-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add third-party.json skills CATALOG.md registry.json
          git commit -m "chore(skills): update the third-party skills from upstream"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(skills): update the third-party skills from upstream" --body "Copied by the weekly third-party workflow from the upstream registry. Review the diff, run the local gates and merge in the next release sitting."
